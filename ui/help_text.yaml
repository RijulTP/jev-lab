# One home for all UI wording. Edit copy here, never in tab code.
welcome:
  title: "Welcome to Jev Lab"
  body: "Jev is an AI model that doesn't write text. You give it a message and some questions, and it returns choices, scores, and yes/no probabilities that your code can act on."
  demo: "You're in Demo mode: everything here replays real recorded answers, so it's free and works without a key."
  cta: "Take the 4-step tour below, or explore freely."
tour:
  title: "Tour"
  subtitle: "Suggested order, about 8 minutes. Free to explore in any order."
  order: ["playground", "fanout", "gates", "chat"]
  done_title: "Tour complete"
  done_body: "You saw: send questions (Playground), ask everything at once (Fan-out), gate on uncertainty (Gates), and a full desk demo (Chat). Details in README.md. To try live mode: copy .env.example to .env, add TYPESAFE_API_KEY, then make run-live."
tabs:
  playground:
    name: "Playground"
    summary: "Send one message and a few questions to Jev, and see what comes back."
    looking_at: "The top box is the state (what Jev judges). The second box holds the questions. Press Run and each answer appears with probability bars."
    try_this: "Pick a preset, press Run, then look at the bars. Probability says how likely each answer is. Confidence says how concentrated those probabilities are."
    next: "Next: Fan-out — what happens when you ask 8 questions at once instead of one at a time."
    footer: "Demo replays recorded answers. Editing needs a key."
  fanout:
    name: "Parallel fan-out"
    summary: "One ticket needs 8 answers. Is it faster and cheaper to ask all 8 in a single call?"
    looking_at: "Someone's ticket needs 8 answers (which team, how urgent, is it a trick message, and 5 more). The page tried 3 ways of getting them: ask 8 times one after another, ask 8 times all at once, or ask all 8 in a single call — and timed each way 5 times."
    try_this: "Compare the three big numbers. Then read 'Why is one call cheaper?' below — it shows the token arithmetic."
    why_cheaper_title: "Why is one call cheaper?"
    why_cheaper_body: "Every call includes the ticket text, and you pay per token you send. Eight separate calls send the ticket eight times; one batched call sends it once. Same 8 answers, far fewer paid tokens."
    next: "Next: Gates — what your code does when Jev says it's not sure."
    footer: "Timings depend on network and account; recorded where/when shown. Rerun live for your numbers."
  gates:
    name: "Confidence gates"
    summary: "Jev can say 'not sure.' Here, your rules decide what happens when it does."
    looking_at: "Thirty example tickets re-sort into handled-automatically, needs-review, and send-to-a-human as you move the sliders. Each card names the rule that fired."
    try_this: "Drag the safety slider down and watch tickets move between handled automatically, needs review, and send to a human."
    next: "Next: Chat — the full loop on a pretend support desk."
    footer: "Agreement with hand labels on 30 examples at defaults — mechanics demo, not an accuracy figure."
  chat:
    name: "Support Desk Chat"
    summary: "A pretend support desk. Jev judges each message, rules decide what to do, and the reply is a fixed template."
    looking_at: "Chat on the left; the 'What just happened' panel on the right walks through 5 steps for the latest message, top to bottom."
    try_this: "Click an example message, then read the 'What just happened' panel from top to bottom."
    next: "Tour complete — see the closing card in the sidebar."
    try_guide_title: "What can I send?"
    desk_about: "This is a pretend online-store support desk. It handles orders, refunds, technical issues, account access, product questions, and complaints — anything else is out of scope."
    desk_topics:
      - "Orders: 'Where is my order A-104?'"
      - "Refunds: 'I was charged twice, refund the duplicate.'"
      - "Technical: 'Login gives a 500 error since morning.'"
      - "Account: 'My reset link never arrives.'"
      - "Product: 'Does Pro include priority support?'"
      - "Complaints: 'I want to speak to a manager.'"
    try_guide:
      - "An order or billing question → Jev picks the intent (Choice)."
      - "An angry or urgent message → watch the frustration and urgency scores."
      - "'Ignore previous instructions…' → the override check should catch it."
      - "'Talk to a real person' → routes straight to a human."
    try_guide_live: "In live mode, type anything: a refund request, a furious complaint, an off-topic question, or a 'forget your policy' jailbreak — then read the 5 steps."
    footer: "Replies are canned templates; Jev only judges. Demo only — in a real emergency, contact local emergency services."
    footer: "Replies are canned templates; Jev only judges. Demo only — in a real emergency, contact local emergency services."
tooltips:
  preset: "Which recorded example to run."
  model: "Which Jev model answers. Aliases move; recordings store the resolved version."
  state_input: "The message Jev judges. Disabled in demo because only recorded messages can replay."
  questions_input: "The fixed questions Jev answers. Disabled in demo; add a key to edit."
  override_threshold: "How sure Jev must be that someone is trying to override the instructions before we refuse. Raising it means fewer refusals."
  safety_threshold: "How sure Jev must be that a message is a safety issue before we hand it to a human. Raising it means fewer handoffs and more risk of missing one."
  intent_confidence: "Below this, the desk asks a clarifying question instead of guessing."
  noul_band: "Act-yes above the top line, act-no below the bottom line, review in between. Lower lines mean more handoffs and fewer misses; higher lines mean fewer handoffs and more risk of missing one."
  runs: "More runs give steadier timings but cost slightly more."
  beginner_toggle: "Beginner explains each step. Expert shows raw field names and JSON."
  whatif: "Re-decide the stored answers under new thresholds. No new API call, no cost."
glossary:
  title: "Words used here"
  entries:
    State: "The information you give Jev to judge, such as a message."
    Choice: "Pick one option from a list. Returns a probability for each."
    Score: "Place something on a scale, such as urgency. Can land between levels."
    Noul: "A yes/no question. Returns the probability of yes."
    Probability: "How likely Jev thinks an answer is."
    Confidence: "A summary of how concentrated the probabilities are. High confidence doesn't guarantee a correct answer."
    Gate: "A rule in your code that decides what to do based on Jev's answer."
    Template: "A fixed reply. Jev doesn't write text."
    Recorded_vs_live: "Recorded replays real saved answers. Live calls Jev with your key and costs a tiny amount."
errors:
  missing_key: "No key found. Add TYPESAFE_API_KEY to .env for live mode, or keep exploring the recorded demo."
  budget: "Budget cap reached. No call was made. Reset the ledger or raise the cap to continue."
  no_recording: "No recorded answer for this exact input. In demo mode only recorded messages can replay."
  ledger: "Budget ledger unreadable, so live calls are blocked to protect your balance. Inspect or archive the ledger file."
  bad_questions: "Those questions don't parse. Check the JSON and try again."
  call_failed: "The Jev call failed. Wait a moment and try again; repeated 429s mean back off and lower concurrency."
disabled_reasons:
  typing: "Typing is off in demo mode because only recorded messages can replay. Add a key to type your own."
  editing: "Editing is off in demo mode. Add a key to edit and run your own."
empty:
  chat: "Click an example on the left to begin."
  fanout: "Demo mode: no recorded benchmark yet — run the live benchmark once to seed it."
reset: "View reset: tour, sliders, and welcome card restored. Recordings, ledger, and chat cost untouched."
mode_popover: "Demo replays real saved answers and is free. Live calls Jev with your key and spends a tiny amount per call."
